name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  api:
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main') && fromJSON('["self-hosted","Linux","X64","docker","octor-prd"]') || fromJSON('["self-hosted","Linux","X64","docker","octor-dev"]') }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo clippy -- -D warnings

  web:
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main') && fromJSON('["self-hosted","Linux","X64","docker","octor-prd"]') || fromJSON('["self-hosted","Linux","X64","docker","octor-dev"]') }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build
